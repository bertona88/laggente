worker_processes 1;
pid /tmp/nginx.pid;
# Request-context error messages can include the raw request line and query.
# Keep container error output to process-critical failures; health/access logs
# retain query-free operational evidence.
error_log /dev/stderr crit;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Deliberately omit query strings, referers, cookies, and authorization data.
    # Magic-link and signed-download tokens may be present in URL arguments.
    log_format laggente_safe escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"client":"$remote_addr","host":"$host","method":"$request_method",'
        '"uri":"$uri","protocol":"$server_protocol","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout laggente_safe;

    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 16m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $host $laggente_valid_host {
        default 0;
        ~^laggente\.com$ 1;
        "~^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.laggente\.com$" 1;
    }

    # The brand apex is the only crawl target in the pilot. Studio and tenant
    # spaces stay out of search until an explicit professional opt-in exists.
    # Use the original request URI here. `try_files` internally redirects SPA
    # routes to /index.html, which mutates $uri before response headers are
    # evaluated and would otherwise mark the canonical apex homepage noindex.
    map "$host:$request_uri" $laggente_robots_header {
        default "noindex, nofollow";
        "laggente.com:/" "";
        ~^laggente\.com:/\? "";
    }

    # Canonical product paths must land on the host that owns their cookie or
    # anonymous continuation identity before the SPA starts. Query arguments
    # are retained in Location but deliberately remain absent from access logs.
    map "$host:$uri" $laggente_canonical_location {
        default "";
        ~^(?:laggente\.com|www\.laggente\.com):(?<studio_path>/(?:login|studio)(?:/.*)?)$ https://app.laggente.com$studio_path;
        "~^(?:laggente\.com|www\.laggente\.com|app\.laggente\.com):/(?!(?:admin|api|app|assets|blog|login|mail|privacy|send|spazio|staging|static|status|studio|support|terms|www)$)(?<public_slug_root>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)$" https://$public_slug_root.laggente.com/;
        "~^(?:laggente\.com|www\.laggente\.com|app\.laggente\.com):/(?!(?:admin|api|app|assets|blog|login|mail|privacy|send|spazio|staging|static|status|studio|support|terms|www)/)(?<public_slug>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)(?<public_path>/.*)$" https://$public_slug.laggente.com$public_path;
        "app.laggente.com:/" https://app.laggente.com/studio;
    }

    server {
        listen 8080 default_server;
        server_name _;

        if ($laggente_valid_host = 0) {
            return 444;
        }

        if ($laggente_canonical_location != "") {
            return 308 $laggente_canonical_location$is_args$args;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        root /usr/share/nginx/html;
        index index.html;

        location = /_gateway_health {
            access_log off;
            try_files /index.html =503;
        }

        location = /api/health {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_real_ip;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/healthz {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_real_ip;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/readyz {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream/readyz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_real_ip;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/v1 {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $http_x_real_ip;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ^~ /api/v1/ {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $http_x_real_ip;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /api {
            default_type application/json;
            return 404 '{"detail":"Not Found"}\n';
        }

        location /api/ {
            default_type application/json;
            return 404 '{"detail":"Not Found"}\n';
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            add_header Cache-Control "no-cache";
            add_header X-Robots-Tag $laggente_robots_header always;
            try_files $uri $uri/ /index.html;
        }
    }
}
