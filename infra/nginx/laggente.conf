# This file is included from nginx's http context through sites-enabled.
map $http_upgrade $laggente_host_connection_upgrade {
    default upgrade;
    '' close;
}

# Query strings can carry magic-link and signed-download tokens. This site uses
# a dedicated format that logs the normalized path only, never args or referer.
log_format laggente_safe escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"client":"$remote_addr","host":"$host","method":"$request_method",'
    '"uri":"$uri","protocol":"$server_protocol","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

limit_req_zone $binary_remote_addr zone=laggente_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=laggente_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=laggente_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=laggente_upload:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=laggente_connections:10m;
limit_conn_zone $server_name zone=laggente_upload_connections:1m;

upstream laggente_gateway {
    server 127.0.0.1:45200;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name laggente.com www.laggente.com app.laggente.com *.laggente.com;
    access_log /var/log/nginx/laggente.access.log laggente_safe;
    error_log /var/log/nginx/laggente.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.laggente.com;
    access_log /var/log/nginx/laggente.access.log laggente_safe;
    error_log /var/log/nginx/laggente.error.log crit;

    ssl_certificate /etc/letsencrypt/live/laggente.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laggente.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://laggente.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name laggente.com app.laggente.com *.laggente.com;
    access_log /var/log/nginx/laggente.access.log laggente_safe;
    error_log /var/log/nginx/laggente.error.log crit;

    ssl_certificate /etc/letsencrypt/live/laggente.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laggente.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LAGGENTE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 16m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn laggente_connections 30;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Public HTML and private attachment content are both consumed on their owning host. Prevent a
    # sibling tenant origin from embedding cookie-authorized media.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Request-ID $request_id always;

    proxy_hide_header X-Powered-By;

    location ^~ /api/v1/auth/ {
        limit_req zone=laggente_auth burst=5 nodelay;
        proxy_pass http://laggente_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $laggente_host_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/api/v1/public/conversations/[^/]+/attachments/?$ {
        limit_req zone=laggente_upload burst=3 nodelay;
        # Match the API's pre-parser semaphore so multipart spooling cannot exhaust /tmp or RSS.
        limit_conn laggente_upload_connections 2;
        proxy_pass http://laggente_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location = /api/v1 {
        limit_req zone=laggente_api burst=20 nodelay;
        proxy_pass http://laggente_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/v1/ {
        limit_req zone=laggente_api burst=20 nodelay;
        proxy_pass http://laggente_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $laggente_host_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Exact health routes continue through the gateway. Every other /api path
    # is rejected here so it can never receive the Vite history fallback.
    location = /api/health {
        limit_req zone=laggente_api burst=5 nodelay;
        proxy_pass http://laggente_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/healthz {
        limit_req zone=laggente_api burst=5 nodelay;
        proxy_pass http://laggente_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/readyz {
        limit_req zone=laggente_api burst=5 nodelay;
        proxy_pass http://laggente_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api {
        default_type application/json;
        return 404 '{"detail":"Not Found"}\n';
    }

    location /api/ {
        default_type application/json;
        return 404 '{"detail":"Not Found"}\n';
    }

    location / {
        limit_req zone=laggente_general burst=60 nodelay;
        proxy_pass http://laggente_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $laggente_host_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
