# Temporary HTTP-only vhost used solely to issue the first named SAN certificate.
server {
    listen 80;
    listen [::]:80;
    server_name laggente.com www.laggente.com app.laggente.com mauro.laggente.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
