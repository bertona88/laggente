[general]
listen = "116.203.123.0:53"
protocol = "both4"
domain = "auth.laggente.com"
nsname = "auth.laggente.com"
nsadmin = "hostmaster.laggente.com"
records = [
    "auth.laggente.com. A 116.203.123.0",
    "auth.laggente.com. NS auth.laggente.com.",
]
debug = false

[database]
engine = "sqlite"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "127.0.0.1"
disable_registration = true
port = "5399"
tls = "none"
corsorigins = []
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "json"
